name: goarag

services:
  qdrant:
    image: qdrant/qdrant:v1.13.0
    container_name: goarag-qdrant
    restart: unless-stopped
    ports:
      - '6333:6333' # REST + dashboard at http://localhost:6333/dashboard
      - '6334:6334' # gRPC
    volumes:
      - qdrant-storage:/qdrant/storage
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:-}
      QDRANT__LOG_LEVEL: INFO
    healthcheck:
      # The Qdrant image is distroless — no curl/wget — so probe over its own
      # TCP port with bash's /dev/tcp instead.
      test: ['CMD-SHELL', 'timeout 3 bash -c "</dev/tcp/localhost/6333" || exit 1']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: goarag-server
    restart: unless-stopped
    ports:
      - '${PORT:-8787}:8787'
    depends_on:
      qdrant:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 8787
      LOG_LEVEL: ${LOG_LEVEL:-info}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173,http://localhost:8080}

      GROQ_API_KEY: ${GROQ_API_KEY:?GROQ_API_KEY is required}
      GROQ_BASE_URL: ${GROQ_BASE_URL:-https://api.groq.com/openai/v1}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-120b}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      SARVAM_API_KEY: ${SARVAM_API_KEY:-}

      # Inside Compose, Qdrant is always reachable — require it rather than
      # silently falling back to the embedded store.
      VECTOR_STORE: qdrant
      QDRANT_URL: http://qdrant:6333
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-goarag_msmarco_xi}

      # BGE-M3 runs in-process via ONNX. The weights (~550MB) are cached in the
      # `models` volume below, so only the first start pays the download.
      EMBEDDING_PROVIDER: local
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-1024}
      RERANKER_PROVIDER: ${RERANKER_PROVIDER:-heuristic}

      DATASET_SOURCE: ${DATASET_SOURCE:-auto}
      DATASET_MAX_ROWS: ${DATASET_MAX_ROWS:-300}
      DATASET_LANGUAGES: ${DATASET_LANGUAGES:-hin_Deva}
    volumes:
      - model-cache:/app/models
      - dataset-cache:/app/dataset
      - server-storage:/app/storage

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
      args:
        # Empty means same-origin; set to the public API URL when the frontend
        # is served from a different host than the API.
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8787}
    container_name: goarag-client
    restart: unless-stopped
    ports:
      - '${CLIENT_PORT:-8080}:80'
    depends_on:
      - server

volumes:
  qdrant-storage:
  model-cache:
  dataset-cache:
  server-storage:
